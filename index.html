<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Bulletin New Daily</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="news-header">

        <div class="container-fluid px-3 px-lg-4">

            <!-- 1. Newspaper Masthead -->
            <div class="news-masthead text-center">
                <a href="/" class="news-brand">
                    The Bulletin Daily
                </a>
                <div class="news-brand-accent"></div>
                <p class="news-tagline">
                    YOUR DAILY NEWS BRIEFING
                </p>
            </div>

            <!-- 2. Search Bar -->
            <div class="news-search-row">

                <form class="news-search-form" role="search" method="GET">

                    <div class="input-group">

                        <span class="input-group-text news-search-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" aria-hidden="true">
                                <circle cx="11" cy="11" r="8"></circle>
                                <path d="m21 21-4.35-4.35"></path>
                            </svg>
                        </span>

                        <input class="form-control" type="search" name="query"
                            placeholder="Search articles, topics and headlines..." aria-label="Search news">

                        <input type="hidden" name="pageno" value="1">

                        <button class="btn news-search-btn" type="submit">
                            Search
                        </button>

                    </div>

                </form>

            </div>

            <!-- 3. Navigation Options -->
            <nav class="navbar navbar-expand-md news-navigation">

                <div class="container-fluid justify-content-center p-0">

                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                        data-bs-target="#newsNavigation" aria-controls="newsNavigation" aria-expanded="false"
                        aria-label="Toggle navigation">

                        <span class="navbar-toggler-icon"></span>

                    </button>

                    <div class="collapse navbar-collapse justify-content-center" id="newsNavigation">
                        <ul class="navbar-nav news-nav-links">

                            <li class="nav-item">
                                <a class="nav-link active" aria-current="page" href="/">
                                    Home
                                </a>
                            </li>

                            <li class="nav-item">
                                <a class="nav-link" href="/weather">
                                    Weather
                                </a>
                            </li>

                            <li class="nav-item">
                                <a class="nav-link" href="/latest">
                                    Latest
                                </a>
                            </li>

                        </ul>
                    </div>

                </div>
            </nav>
        </div>
    </header>

    <div class="container my-4">
        <div class="row" id="content">
        </div>
    </div>

    <div class="prevNext my-4 d-flex justify-content-center">
        <nav aria-label="Page navigation example">
            <ul class="pagination">
                <li class="page-item"><a id="pre" class="page-link" href="">Previous</a></li>
                <li class="page-item"><a class="page-link" href="#">1</a></li>
                <li class="page-item"><a class="page-link" href="#">2</a></li>
                <li class="page-item"><a class="page-link" href="#">3</a></li>
                <li class="page-item"><a id="next" class="page-link" href="#">Next</a></li>
            </ul>
        </nav>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous">
        </script>
    <script src="script.js"></script>
</body>

</html>
